<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Latest Projects | Apex Audio & Video Systems</title>
  <meta name="description" content="View recent TV mounting, security camera, home theater, networking and audio/video installations by Apex Audio & Video Systems.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #fff;
      line-height: 1.6;
    }

    header {
      background: #111;
      border-bottom: 1px solid #2b2b2b;
      padding: 22px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
    }

    .brand span {
      color: #f36c21;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
    }

    nav a:hover {
      color: #f36c21;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 45px;
      background:
        linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.9)),
        #111;
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1.05;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #f36c21;
    }

    .hero p {
      max-width: 700px;
      margin: auto;
      color: #bbb;
      font-size: 18px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 45px 20px 80px;
    }

    #projectsGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .project-card {
      background: #131313;
      border: 1px solid #292929;
      border-radius: 15px;
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: #f36c21;
    }

    .project-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #1b1b1b;
    }

    .project-content {
      padding: 22px;
    }

    .project-content h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .service {
      color: #f36c21;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .description {
      color: #ccc;
      margin-bottom: 15px;
    }

    .meta {
      color: #999;
      font-size: 14px;
      margin-top: 6px;
    }

    .featured {
      display: inline-block;
      background: #f36c21;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 9px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    #status {
      text-align: center;
      color: #aaa;
      padding: 50px 15px;
      font-size: 18px;
    }

    .error {
      color: #ff7676 !important;
    }

    footer {
      border-top: 1px solid #222;
      background: #0d0d0d;
      text-align: center;
      color: #888;
      padding: 30px 20px;
    }

    @media (max-width: 900px) {
      #projectsGrid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .header-inner {
        display: block;
      }

      nav {
        margin-top: 12px;
      }

      nav a {
        margin: 0 15px 0 0;
      }

      #projectsGrid {
        grid-template-columns: 1fr;
      }

      .project-image {
        height: 240px;
      }

      .hero {
        padding-top: 50px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      APEX <span>AUDIO & VIDEO</span>
    </div>

    <nav>
      <a href="/">Home</a>
      <a href="/services/">Services</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>Our Latest <span>Projects</span></h1>

  <p>
    Take a look at some of our latest professional audio, video,
    security, networking and installation projects.
  </p>
</section>

<main>

  <div id="status">
    Loading projects...
  </div>

  <div id="projectsGrid"></div>

</main>

<footer>
  © Apex Audio & Video Systems LLC
</footer>

<script>
  const SUPABASE_URL =
    "https://lexzgzmjugfdvqapyxav.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_0Q9BDbrZenQqZCTozIU-kA_G6SvjGGH";

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const grid = document.getElementById("projectsGrid");
  const status = document.getElementById("status");

  function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(date) {
    if (!date) return "";

    const parsed = new Date(date + "T00:00:00");

    if (Number.isNaN(parsed.getTime())) {
      return escapeHTML(date);
    }

    return parsed.toLocaleDateString("en-US", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });
  }

  async function loadProjects() {

    status.textContent = "Loading projects...";
    status.classList.remove("error");

    const { data, error } = await db
      .from("projects")
      .select("*")
      .eq("is_published", true)
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Supabase error:", error);

      status.textContent =
        "Projects could not be loaded.";

      status.classList.add("error");

      return;
    }

    if (!data || data.length === 0) {

      status.textContent =
        "No projects have been published yet.";

      return;
    }

    status.style.display = "none";

    grid.innerHTML = data.map(project => {

      const image = project.featured_image_url
        ? `
          <img
            class="project-image"
            src="${escapeHTML(project.featured_image_url)}"
            alt="${escapeHTML(project.title || "Apex project")}"
            loading="lazy"
          >
        `
        : "";

      const featured = project.is_featured
        ? `<div class="featured">FEATURED PROJECT</div>`
        : "";

      const service = project.service_type
        ? `<div class="service">${escapeHTML(project.service_type)}</div>`
        : "";

      const description = project.description
        ? `<p class="description">${escapeHTML(project.description)}</p>`
        : "";

      const location = project.location
        ? `<div class="meta">📍 ${escapeHTML(project.location)}</div>`
        : "";

      const date = project.project_date
        ? `<div class="meta">📅 ${formatDate(project.project_date)}</div>`
        : "";

      return `
        <article class="project-card">

          ${image}

          <div class="project-content">

            ${featured}

            <h2>
              ${escapeHTML(project.title || "Apex Project")}
            </h2>

            ${service}
            ${description}
            ${location}
            ${date}

          </div>

        </article>
      `;

    }).join("");
  }

  loadProjects();
</script>

</body>
</html>
