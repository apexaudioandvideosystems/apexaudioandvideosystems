<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="noindex,nofollow">

  <title>Social Media | Apex Admin</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 850px;
      margin: 0 auto;
      padding: 50px 0;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #bcbcbc;
      margin-bottom: 35px;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 30px;
    }

    .field {
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 17px;
    }

    input[type="url"] {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #171717;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input[type="url"]:focus {
      border-color: #ff5a00;
    }

    .enabled {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .enabled label {
      display: inline;
      margin: 0;
      font-size: 15px;
    }

    .enabled input {
      width: 18px;
      height: 18px;
    }

    button {
      width: 100%;
      border: none;
      padding: 17px;
      border-radius: 8px;
      background: linear-gradient(
        90deg,
        #ff3d00,
        #ff7900
      );
      color: white;
      font-weight: bold;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      min-height: 25px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #ff6a00;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="index.html" class="back">
      ← Back to Admin
    </a>

    <h1>Social Media</h1>

    <p class="subtitle">
      Manage the social media links displayed on the Apex website.
    </p>


    <div class="card">

      <!-- FACEBOOK -->

      <div class="field">

        <label for="facebook">
          Facebook
        </label>

        <input
          type="url"
          id="facebook"
          placeholder="https://facebook.com/..."
        >

        <div class="enabled">

          <input
            type="checkbox"
            id="facebook_enabled"
          >

          <label for="facebook_enabled">
            Show Facebook on website
          </label>

        </div>

      </div>


      <!-- INSTAGRAM -->

      <div class="field">

        <label for="instagram">
          Instagram
        </label>

        <input
          type="url"
          id="instagram"
          placeholder="https://instagram.com/..."
        >

        <div class="enabled">

          <input
            type="checkbox"
            id="instagram_enabled"
          >

          <label for="instagram_enabled">
            Show Instagram on website
          </label>

        </div>

      </div>


      <!-- TIKTOK -->

      <div class="field">

        <label for="tiktok">
          TikTok
        </label>

        <input
          type="url"
          id="tiktok"
          placeholder="https://tiktok.com/@..."
        >

        <div class="enabled">

          <input
            type="checkbox"
            id="tiktok_enabled"
          >

          <label for="tiktok_enabled">
            Show TikTok on website
          </label>

        </div>

      </div>


      <!-- GOOGLE -->

      <div class="field">

        <label for="google">
          Google Business Profile
        </label>

        <input
          type="url"
          id="google"
          placeholder="https://g.page/..."
        >

        <div class="enabled">

          <input
            type="checkbox"
            id="google_enabled"
          >

          <label for="google_enabled">
            Show Google on website
          </label>

        </div>

      </div>


      <!-- SAVE BUTTON -->

      <button
        id="saveButton"
        type="button"
      >
        Save Social Media Links
      </button>


      <div id="message"></div>

    </div>

  </div>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async function () {

        // ============================
        // SUPABASE
        // ============================

        const SUPABASE_URL =
          "https://lexzgzmjugfdvqapyxav.supabase.co";

        const SUPABASE_KEY =
          "sb_publishable_0Q9BDbrZenQqZCTozIU-kA_G6SvjGGH";


        const supabaseClient =
          supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );


        // ============================
        // PLATFORMS
        // ============================

        const platforms = [
          "facebook",
          "instagram",
          "tiktok",
          "google"
        ];


        const saveButton =
          document.getElementById(
            "saveButton"
          );

        const message =
          document.getElementById(
            "message"
          );


        // ============================
        // MESSAGE
        // ============================

        function showMessage(
          text,
          error = false
        ) {

          message.textContent = text;

          message.style.color =
            error
              ? "#ff6666"
              : "#4ade80";

        }


        // ============================
        // LOAD SAVED LINKS
        // ============================

        async function loadLinks() {

          showMessage(
            "Loading saved links..."
          );


          const {
            data,
            error
          } =
            await supabaseClient
              .from("social_links")
              .select(
                "platform,url,is_enabled"
              );


          if (error) {

            console.error(
              "LOAD ERROR:",
              error
            );

            showMessage(
              "Load error: " +
              error.message,
              true
            );

            return;
          }


          if (data) {

            data.forEach(
              function (row) {

                const urlInput =
                  document.getElementById(
                    row.platform
                  );


                const checkbox =
                  document.getElementById(
                    row.platform +
                    "_enabled"
                  );


                if (urlInput) {

                  urlInput.value =
                    row.url || "";

                }


                if (checkbox) {

                  checkbox.checked =
                    row.is_enabled === true;

                }

              }
            );

          }


          showMessage("");

        }


        // ============================
        // SAVE LINKS
        // ============================

        async function saveLinks() {

          saveButton.disabled = true;

          saveButton.textContent =
            "Saving...";

          showMessage(
            "Saving..."
          );


          try {

            for (
              const platform
              of platforms
            ) {

              const urlInput =
                document.getElementById(
                  platform
                );


              const checkbox =
                document.getElementById(
                  platform +
                  "_enabled"
                );


              if (
                !urlInput ||
                !checkbox
              ) {

                throw new Error(
                  "Missing field for " +
                  platform
                );

              }


              const url =
                urlInput.value.trim();


              const enabled =
                checkbox.checked;


              const {
                data,
                error
              } =
                await supabaseClient
                  .from(
                    "social_links"
                  )
                  .update({

                    url: url,

                    is_enabled:
                      enabled,

                    updated_at:
                      new Date()
                        .toISOString()

                  })

                  .eq(
                    "platform",
                    platform
                  )

                  .select();


              if (error) {

                throw error;

              }


              console.log(
                platform,
                "saved:",
                data
              );

            }


            showMessage(
              "✓ Social media links saved successfully!"
            );


          } catch (error) {

            console.error(
              "SAVE ERROR:",
              error
            );


            showMessage(
              "Save error: " +
              error.message,
              true
            );


          } finally {

            saveButton.disabled =
              false;

            saveButton.textContent =
              "Save Social Media Links";

          }

        }


        // ============================
        // BUTTON
        // ============================

        saveButton.addEventListener(
          "click",
          saveLinks
        );


        // ============================
        // LOAD PAGE
        // ============================

        await loadLinks();

      }
    );

  </script>

</body>
</html>
