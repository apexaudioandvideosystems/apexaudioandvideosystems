<script>
document.addEventListener("DOMContentLoaded", async function () {

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL =
    "https://lexzgzmjugfdvqapyxav.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_0Q9BDbrZenQqZCTozIU-kA_G6SvjGGH";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==========================================
  // SOCIAL MEDIA PLATFORMS
  // These names must match the "platform"
  // column in your Supabase social_links table.
  // ==========================================

  const platforms = [
    "facebook",
    "instagram",
    "tiktok",
    "google"
  ];


  // ==========================================
  // PAGE ELEMENTS
  // ==========================================

  const saveButton =
    document.getElementById("saveButton");

  const message =
    document.getElementById("message");


  // ==========================================
  // DISPLAY MESSAGE
  // ==========================================

  function showMessage(text, isError = false) {

    if (!message) {
      console.log(text);
      return;
    }

    message.textContent = text;

    message.style.marginTop = "15px";
    message.style.fontWeight = "bold";

    if (isError) {
      message.style.color = "#ff6b6b";
    } else {
      message.style.color = "#4ade80";
    }
  }


  // ==========================================
  // LOAD EXISTING LINKS FROM SUPABASE
  // ==========================================

  async function loadLinks() {

    try {

      const { data, error } =
        await supabaseClient
          .from("social_links")
          .select("platform,url,is_enabled");

      if (error) {
        throw error;
      }

      if (!data) {
        return;
      }


      data.forEach(function (row) {

        const platform = row.platform;

        const urlInput =
          document.getElementById(platform);

        const enabledCheckbox =
          document.getElementById(
            platform + "_enabled"
          );


        if (urlInput) {
          urlInput.value = row.url || "";
        }


        if (enabledCheckbox) {
          enabledCheckbox.checked =
            row.is_enabled === true;
        }

      });


      console.log(
        "Social media links loaded successfully."
      );


    } catch (error) {

      console.error(
        "Error loading social links:",
        error
      );

      showMessage(
        "Could not load saved links: " +
        error.message,
        true
      );
    }
  }


  // ==========================================
  // SAVE LINKS TO SUPABASE
  // ==========================================

  async function saveLinks() {

    if (!saveButton) {
      console.error(
        'Could not find button with id="saveButton".'
      );

      return;
    }


    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    showMessage("");


    try {

      for (const platform of platforms) {

        const urlInput =
          document.getElementById(platform);

        const enabledCheckbox =
          document.getElementById(
            platform + "_enabled"
          );


        if (!urlInput) {

          throw new Error(
            'Missing input id="' +
            platform +
            '"'
          );

        }


        if (!enabledCheckbox) {

          throw new Error(
            'Missing checkbox id="' +
            platform +
            '_enabled"'
          );

        }


        const url =
          urlInput.value.trim();

        const enabled =
          enabledCheckbox.checked;


        console.log(
          "Saving:",
          platform,
          url,
          enabled
        );


        const { data, error } =
          await supabaseClient
            .from("social_links")
            .update({
              url: url,
              is_enabled: enabled,
              updated_at:
                new Date().toISOString()
            })
            .eq("platform", platform)
            .select();


        if (error) {
          throw error;
        }


        console.log(
          platform +
          " saved successfully:",
          data
        );

      }


      showMessage(
        "✓ Social media links saved successfully!"
      );


    } catch (error) {

      console.error(
        "SAVE ERROR:",
        error
      );


      showMessage(
        "Error saving links: " +
        error.message,
        true
      );


    } finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "Save Social Media Links";

    }
  }


  // ==========================================
  // SAVE BUTTON
  // ==========================================

  if (saveButton) {

    saveButton.addEventListener(
      "click",
      saveLinks
    );

  } else {

    console.error(
      'Could not find button with id="saveButton".'
    );

  }


  // ==========================================
  // LOAD SAVED INFORMATION WHEN PAGE OPENS
  // ==========================================

  await loadLinks();

});
</script>
