<script>
const SUPABASE_URL =
  "https://lexzgzmjugfdvqapyxav.supabase.co";

const SUPABASE_KEY =
  "YOUR_CURRENT_PUBLISHABLE_KEY";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let projects = [];

/* -----------------------------
   CHECK LOGIN
----------------------------- */

async function requireLogin() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    console.error("Session error:", error);
    return null;
  }

  if (!data.session) {
    alert("Your login session was not found. Please log in again.");
    window.location.href = "index.html";
    return null;
  }

  console.log(
    "Logged in:",
    data.session.user.email
  );

  return data.session;
}


/* -----------------------------
   CREATE SLUG
----------------------------- */

function slugify(text) {
  return text
    .toString()
    .toLowerCase()
    .trim()
    .replace(/[^\w\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-");
}


/* -----------------------------
   SHOW MESSAGE
----------------------------- */

function showMessage(text, success = true) {

  const message =
    document.getElementById("message");

  if (!message) {
    alert(text);
    return;
  }

  message.textContent = text;

  message.style.color =
    success ? "#4ade80" : "#ff7777";
}


/* -----------------------------
   SAVE PROJECT
----------------------------- */

async function saveProject() {

  showMessage("Saving project...", true);

  const session = await requireLogin();

  if (!session) return;


  /* PROJECT TITLE */

  const title =
    document
      .getElementById("title")
      .value
      .trim();

  if (!title) {
    showMessage(
      "Please enter a project title.",
      false
    );

    return;
  }


  /* EXISTING PROJECT ID */

  const id =
    document.getElementById("projectId")
      ?.value || "";


  /* IMAGE */

  const imageInput =
    document.getElementById(
      "featuredImageFile"
    );

  const imageFile =
    imageInput?.files?.[0];

  let imageUrl =
    document.getElementById(
      "featuredImage"
    )?.value || null;


  /* UPLOAD NEW IMAGE */

  if (imageFile) {

    showMessage(
      "Uploading image...",
      true
    );

    const extension =
      imageFile.name
        .split(".")
        .pop()
        .toLowerCase();

    const fileName =
      `${session.user.id}/` +
      `${Date.now()}-` +
      `${Math.random()
        .toString(36)
        .substring(2)}.${extension}`;


    const {
      data: uploadData,
      error: uploadError
    } = await db.storage
      .from("project-media")
      .upload(
        fileName,
        imageFile,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


    if (uploadError) {

      console.error(
        "UPLOAD ERROR:",
        uploadError
      );

      showMessage(
        "Image upload failed: " +
        uploadError.message,
        false
      );

      return;
    }


    const {
      data: publicUrlData
    } = db.storage
      .from("project-media")
      .getPublicUrl(
        uploadData.path
      );


    imageUrl =
      publicUrlData.publicUrl;


    const hiddenImage =
      document.getElementById(
        "featuredImage"
      );

    if (hiddenImage) {
      hiddenImage.value =
        imageUrl;
    }
  }


  /* PROJECT RECORD */

  const record = {

    title: title,

    slug: slugify(title),

    description:
      document
        .getElementById(
          "description"
        )
        .value
        .trim(),

    featured_image_url:
      imageUrl,

    seo_title:
      document
        .getElementById(
          "seoTitle"
        )
        .value
        .trim() || null,

    seo_description:
      document
        .getElementById(
          "seoDescription"
        )
        .value
        .trim() || null,

    project_date:
      document
        .getElementById(
          "projectDate"
        )
        .value || null,

    is_featured:
      document
        .getElementById(
          "featured"
        )
        .checked,

    is_published:
      document
        .getElementById(
          "published"
        )
        .checked,

    updated_at:
      new Date()
        .toISOString()
  };


  /* UPDATE OR INSERT */

  let result;


  if (id) {

    result = await db
      .from("projects")
      .update(record)
      .eq("id", id);

  } else {

    result = await db
      .from("projects")
      .insert([record])
      .select();
  }


  if (result.error) {

    console.error(
      "DATABASE ERROR:",
      result.error
    );

    showMessage(
      "Project save failed: " +
      result.error.message,
      false
    );

    return;
  }


  showMessage(
    "Project saved successfully!",
    true
  );


  if (
    typeof loadProjects ===
    "function"
  ) {
    await loadProjects();
  }


  if (
    typeof resetForm ===
    "function"
  ) {
    resetForm();
  }
}


/* -----------------------------
   VERIFY SESSION ON PAGE LOAD
----------------------------- */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    const session =
      await requireLogin();

    if (session) {

      console.log(
        "Apex Admin connected to Supabase."
      );

      if (
        typeof loadProjects ===
        "function"
      ) {
        await loadProjects();
      }
    }
  }
);
</script>
