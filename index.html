<!-- =========================
     APEX LATEST PROJECTS
========================= -->

<section id="latest-projects" style="
  padding:70px 20px;
  background:#080808;
  color:#fff;
">

  <div style="
    max-width:1200px;
    margin:0 auto;
  ">

    <div style="text-align:center;margin-bottom:40px;">

      <h2 style="
        margin:0 0 12px;
        font-size:42px;
        font-weight:800;
      ">
        Latest <span style="color:#ff7a32;">Projects</span>
      </h2>

      <p style="
        margin:0 auto;
        max-width:650px;
        color:#c5c5c5;
        font-size:16px;
        line-height:1.6;
      ">
        Take a look at some of our latest professional audio,
        video, security, networking and installation projects.
      </p>

    </div>

    <!-- Projects are automatically loaded here -->
    <div id="latestProjects" style="
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    ">

      <p style="
        text-align:center;
        grid-column:1/-1;
        color:#aaa;
      ">
        Loading projects...
      </p>

    </div>

    <div style="
      text-align:center;
      margin-top:40px;
    ">

      <a href="/projects/" style="
        display:inline-block;
        background:#ff7a32;
        color:#fff;
        text-decoration:none;
        font-weight:700;
        padding:14px 25px;
        border-radius:8px;
      ">
        View All Projects
      </a>

    </div>

  </div>
</section>


<!-- SUPABASE JAVASCRIPT LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- LOAD PROJECTS FROM SUPABASE -->
<script>
(async function () {

  const SUPABASE_URL =
    "https://lexzgzmjugfdvqapyxav.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_0Q9BDbrZenQqZCTozIU-kA_G6SvjGGH";

  const container =
    document.getElementById("latestProjects");

  if (!container) {
    console.error("Latest Projects container was not found.");
    return;
  }

  try {

    /* Make sure Supabase loaded */
    if (typeof supabase === "undefined") {
      throw new Error("Supabase library did not load.");
    }

    /* Create Supabase connection */
    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    /* Get published projects */
    const { data: projects, error } = await db
      .from("projects")
      .select("*")
      .eq("is_published", true)
      .order("created_at", { ascending: false })
      .limit(3);

    if (error) {
      throw error;
    }

    /* No projects */
    if (!projects || projects.length === 0) {

      container.innerHTML = `
        <p style="
          text-align:center;
          grid-column:1/-1;
          color:#aaa;
        ">
          No projects available yet.
        </p>
      `;

      return;
    }


    /* Build project cards */
    container.innerHTML = projects.map(function(project) {

      const title =
        project.title || "Apex Audio & Video Project";

      const image =
        project.featured_image_url || "";

      const location =
        project.location || "";

      const featured =
        project.is_featured === true;

      const slug =
        project.slug || "";


      return `

        <a
          href="${slug ? "/projects/#" + encodeURIComponent(slug) : "/projects/"}"
          style="
            display:block;
            background:#111;
            border:1px solid rgba(255,255,255,.08);
            border-radius:16px;
            overflow:hidden;
            text-decoration:none;
            color:#fff;
            box-shadow:0 10px 30px rgba(0,0,0,.30);
            transition:transform .2s ease;
          "
        >

          ${image ? `

            <img
              src="${image}"
              alt="${title}"
              loading="lazy"
              style="
                display:block;
                width:100%;
                height:240px;
                object-fit:cover;
              "
            >

          ` : `

            <div style="
              height:240px;
              display:flex;
              align-items:center;
              justify-content:center;
              background:#171717;
              color:#777;
            ">
              Apex Audio & Video
            </div>

          `}


          <div style="padding:20px;">

            ${featured ? `

              <span style="
                display:inline-block;
                margin-bottom:12px;
                padding:6px 11px;
                border-radius:20px;
                background:#ff7a32;
                color:#fff;
                font-size:11px;
                font-weight:800;
              ">
                FEATURED PROJECT
              </span>

            ` : ""}


            <h3 style="
              margin:0 0 8px;
              font-size:21px;
              line-height:1.3;
              color:#fff;
            ">
              ${title}
            </h3>


            ${location ? `

              <p style="
                margin:0;
                color:#aeb8c2;
                font-size:14px;
              ">
                ${location}
              </p>

            ` : ""}

          </div>

        </a>

      `;

    }).join("");


  } catch (err) {

    console.error(
      "Homepage projects error:",
      err
    );

    container.innerHTML = `

      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:20px;
      ">

        <p style="
          margin:0;
          color:#aaa;
        ">
          Unable to load projects.
        </p>

      </div>

    `;

  }

})();
</script>

<!-- =========================
     END LATEST PROJECTS
========================= -->
